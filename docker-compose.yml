services:
  backend:
    build:
      context: ./backend
    ports:
      - "4001:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://backend:4000
    depends_on:
      - backend
